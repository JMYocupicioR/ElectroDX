name: quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
        continue-on-error: true
      - run: npm test
      - run: npm run validate:secrets
      - run: npm run validate:quizzes
      - run: npm run build
