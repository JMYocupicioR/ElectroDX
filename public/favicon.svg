<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bolt-grad-a" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="bolt-grad-b" x1="45" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0" y1="50" x2="100" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#0b1329" stroke="#0ea5e9" stroke-width="1.5" />

  <!-- EMG Waveform Baseline -->
  <path d="M 12 55 L 28 55 L 32 50 L 37 62 L 42 46 L 46 55 L 88 55" stroke="url(#pulse-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- Bioelectric Lightning Main Body -->
  <g filter="url(#glow-fx)">
    <!-- Primary Bolt Facet -->
    <path d="M 54 12 L 24 48 L 46 48 L 38 88 L 76 44 L 52 44 Z" fill="url(#bolt-grad-a)" />

    <!-- Sharp Internal Dimensional Plane -->
    <path d="M 54 12 L 42 48 L 52 44 Z" fill="url(#bolt-grad-b)" opacity="0.9" />

    <!-- Lower Needle Discharge Spike -->
    <path d="M 46 48 L 38 88 L 60 52 L 46 48 Z" fill="url(#bolt-grad-b)" opacity="0.95" />

    <!-- Saltatory Impulse Node -->
    <circle cx="54" cy="12" r="2.5" fill="#f0f9ff" />
    <circle cx="38" cy="88" r="2.2" fill="#38bdf8" />
  </g>
</svg>
